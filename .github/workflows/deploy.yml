name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject version
        run: |
          VERSION=$(date +%y%m%d)
          echo "Injecting version: $VERSION"
          sed -i "s/__VERSION__/$VERSION/g" fr/index.html
          grep "$VERSION" fr/index.html || echo "WARNING: version string not found after substitution"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - uses: actions/deploy-pages@v4
        id: deployment
